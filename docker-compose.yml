services:
  web:
    build: .
    container_name: message-logger
    ports:
      - "5000:5000"
    environment:
      - LOG_FILE=/app/logs/log.txt
    volumes:
      # เก็บ log.txt ไว้ที่เครื่องเรา (./logs/log.txt) เพื่อไม่ให้หายเมื่อลบ container
      - ./logs:/app/logs
    restart: unless-stopped
